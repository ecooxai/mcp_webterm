# Browser clients attach through xterm.js. tmux owns the alternate screen, so
# mouse mode is required for wheel/touchpad scrolling into copy mode.
set-option -g mouse on

# This applies to panes created after the setting is loaded.
set-option -g history-limit 10000

# Browser disconnects must only detach their clients. Keep sessions and the
# foreground server alive while no browser is attached.
set-option -g destroy-unattached off
set-option -g detach-on-destroy on
set-option -s exit-empty off
