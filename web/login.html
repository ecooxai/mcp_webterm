<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#080d15"><title>Sign in · WebTerm</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#080d15;color:#edf4fa;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 20px;background:radial-gradient(ellipse at 50% 0%,#162b36 0,transparent 65%)}.login-shell{width:100%;max-width:420px}.brand{display:flex;align-items:center;gap:10px;margin:0 0 26px;font-weight:650;letter-spacing:-.3px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #24464b;border-radius:11px;color:#76ead0;font:700 20px ui-monospace,monospace;background:#10252b}.login-card{padding:32px;border:1px solid #283442;border-radius:20px;background:#101925;box-shadow:0 24px 70px #0004}.eyebrow{color:#8ce3d1;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:650;margin:0 0 10px}h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:0 0 12px}.copy{font-size:14px;color:#a7b7c9;margin:0 0 28px}label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}.password-row{display:flex;align-items:center;border:1px solid #3a4b5f;background:#0b121c;border-radius:10px;transition:border-color .15s,box-shadow .15s}.password-row:focus-within{border-color:#7ce6d1;box-shadow:0 0 0 3px #7ce6d11c}input{min-width:0;width:100%;height:49px;padding:0 14px;background:transparent;border:0;outline:0;color:#f4f8ff;font:16px system-ui}#password-toggle{background:transparent;border:0;cursor:pointer;color:#a9c6d5;font:600 12px system-ui;padding:12px}button:focus-visible{outline:2px solid #9aeedc;outline-offset:4px}#login-submit{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;height:47px;border:0;border-radius:10px;background:#87ead3;color:#102722;font:650 14px system-ui;cursor:pointer;margin-top:6px}#login-submit:hover{background:#a3f2df}#login-submit:disabled{opacity:.7;cursor:wait}.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.spinner[hidden]{display:none}.form-error{min-height:21px;color:#ffb0b8;font-size:13px;margin:12px 0 8px}.status{color:#8195ab;font-size:12px;text-align:center;min-height:18px;margin:18px 0 0}.footer{color:#74889e;font-size:12px;text-align:center;margin:24px 0 0}.footer span{color:#a4b5c7}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:460px){.login-card{padding:27px 24px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script defer src="/assets/auth.js"></script>

<body><main id="login-view" class="login-shell" aria-labelledby="login-title"><div class="brand"><span class="brand-mark" aria-hidden="true">&gt;_</span>webterm</div><section class="login-card"><p class="eyebrow">Private console</p><h1 id="login-title">Sign in to WebTerm</h1><p class="copy">Pick up where you left off.<br>Your terminal sessions stay running.</p><form id="login-form" method="post" action="/api/v1/login" novalidate><label for="password">Password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" autofocus required maxlength="1024" aria-describedby="login-error"><button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><p id="login-error" class="form-error" role="alert" aria-live="polite"></p><button id="login-submit" type="submit"><span class="spinner" hidden aria-hidden="true"></span><span id="submit-label">Sign in</span></button><p id="login-status" class="status" role="status" aria-live="polite">Ready when you are.</p></form><noscript><p>Enable JavaScript to sign in. No terminal assets are needed to load this page.</p></noscript></section><p class="footer"><span>Password saved in this browser.</span> Sign out to remove it.</p></main></body></html>
